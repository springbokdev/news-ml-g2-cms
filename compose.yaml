# Local development PostgreSQL. Credentials come from the same variables as application-local.yaml.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: newsml_db
      POSTGRES_USER: ${DB_USERNAME_NEWS_ML:?set DB_USERNAME_NEWS_ML}
      POSTGRES_PASSWORD: ${DB_PASSWORD_NEWS_ML:?set DB_PASSWORD_NEWS_ML}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep their data in a versioned directory below this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
