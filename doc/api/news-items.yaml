openapi: 3.0.3
info:
  title: NewsML-G2 CMS — News Items API
  version: 0.1.0
  description: |
    Create and update text news items and retrieve them as NewsML-G2 2.34 News Item XML.

    Business rules: doc/specs/create-news-item.md, doc/specs/update-news-item.md.

    Conventions (CLAUDE.md):
    - 201 on create, 200 on query, 400 on validation failure, 404 when not found,
      500 on an unexpected server error.
    - Errors are RFC 9457 problem details (`application/problem+json`). A business-rule
      violation names the offending input in the `field` property.
    - Number safety: the API carries no fractional numbers. `version` is a whole
      number (`integer`/`int32`). Any future decimal value must be sent as a JSON
      string (`type: string, format: decimal`) and mapped to `BigDecimal`, never
      as a JSON floating-point number.

    Out of scope: draft/withheld workflow, delivery to partners, packages and
    non-text media.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: News Items
    description: Text news items in NewsML-G2 format

paths:
  /api/news-items:
    post:
      tags: [News Items]
      operationId: createNewsItem
      summary: Create a text news item
      description: |
        Creates a NewsML-G2 text news item (`ninat:text`) from the journalist's
        headline, body and language.

        The system always assigns the GUID (`urn:newsml:<provider>:<yyyyMMdd>:<unique-id>`)
        and version 1. Provider, item class and publication status (`stat:usable`) are
        fixed by the system. Any `guid`, `version`, `provider`, `itemClass` or `pubStatus`
        supplied in the request is ignored.

        Accepted content is stored; rejected content is never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNewsItemRequest'
            examples:
              threeParagraphs:
                summary: Article with three paragraphs
                value:
                  headline: Floods hit Cape Town
                  body: "Rain fell.\n\nRoads closed.\n\nSchools shut."
                  language: en
              languageWithRegion:
                summary: Language plus region
                value:
                  headline: Izikhukhula eKapa
                  body: Imvula ina kakhulu.
                  language: zu-ZA
      responses:
        '201':
          description: |
            News item created. Fetch its XML with `GET /api/news-items/{guid}`;
            no `Location` header is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNewsItemResponse'
              example:
                guid: urn:newsml:springbok.space:20261016:3f2b9c1e
                version: 1
        '400':
          description: |
            The article was rejected: a required field is blank or missing, or the
            language is not a well-formed BCP 47 tag.

            A request body that cannot be read at all (e.g. malformed JSON) is also
            answered with 400, but that response is generated by the framework and
            its shape is not part of this contract.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                headlineRequired:
                  summary: Blank headline
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: headline required
                    instance: /api/news-items
                    field: headline
                bodyRequired:
                  summary: Blank body
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: body required
                    instance: /api/news-items
                    field: body
                languageRequired:
                  summary: Missing language
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: language required
                    instance: /api/news-items
                    field: language
                languageInvalid:
                  summary: Language is not a BCP 47 tag
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: language is not a valid language tag
                    instance: /api/news-items
                    field: language
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/news-items/{guid}:
    get:
      tags: [News Items]
      operationId: getNewsItemByGuid
      summary: Retrieve a news item's NewsML-G2 XML by GUID
      description: |
        Returns the `<newsItem>` document, valid against the NewsML-G2 2.34 XSD.
        The headline and body are XML-escaped so they read exactly as entered.
      parameters:
        - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: The News Item XML.
          content:
            application/xml:
              schema:
                type: string
                description: A NewsML-G2 2.34 `<newsItem>` document.
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <newsItem xmlns="http://iptc.org/std/nar/2006-10-01/"
                          guid="urn:newsml:springbok.space:20261016:3f2b9c1e"
                          version="1"
                          standard="NewsML-G2"
                          standardversion="2.34"
                          xml:lang="en">
                  <catalogRef href="http://www.iptc.org/std/catalog/catalog.IPTC-G2-Standards_38.xml"/>
                  <itemMeta>
                    <itemClass qcode="ninat:text"/>
                    <provider literal="springbok.space"/>
                    <versionCreated>2026-10-16T09:30:00+02:00</versionCreated>
                    <pubStatus qcode="stat:usable"/>
                  </itemMeta>
                  <contentMeta>
                    <headline>Floods hit Cape Town</headline>
                  </contentMeta>
                  <contentSet>
                    <inlineXML contenttype="application/xhtml+xml">
                      <html xmlns="http://www.w3.org/1999/xhtml">
                        <body>
                          <p>Rain fell.</p>
                          <p>Roads closed.</p>
                          <p>Schools shut.</p>
                        </body>
                      </html>
                    </inlineXML>
                  </contentSet>
                </newsItem>
        '404':
          description: |
            No news item was ever issued with this GUID. A value that is not a
            well-formed GUID can never have been issued, so it is also answered
            with 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: news item not found
                instance: /api/news-items/urn:newsml:springbok.space:20261016:never-issued
        '406':
          description: |
            The client does not accept `application/xml`. This endpoint produces
            only `application/xml`; the 404 problem above is returned as
            `application/problem+json` regardless of the `Accept` header.
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [News Items]
      operationId: updateNewsItem
      summary: Save an update as a new version of a news item
      description: |
        Replaces the headline, body and language completely and stores the result
        as the next version. The GUID never changes and earlier versions are kept.
      parameters:
        - $ref: '#/components/parameters/Guid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNewsItemRequest'
            example:
              headline: Floods hit Cape Town, two dead
              body: "Rain fell.\n\nRoads closed.\n\nSchools shut."
              language: en
              author: Thandi Nkosi
              version: 1
      responses:
        '200':
          description: The update was accepted and stored as a new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNewsItemResponse'
              example:
                guid: urn:newsml:springbok.space:20261016:3f2b9c1e
                version: 2
        '400':
          description: |
            The update was rejected: the headline, body, language or author is blank
            or missing, or the language is not a well-formed BCP 47 tag. A rejected
            update creates no version, and the item stays at its current version.

            A request body that cannot be read at all (e.g. malformed JSON) is also
            answered with 400, but that response is generated by the framework and
            its shape is not part of this contract.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                headlineRequired:
                  summary: Blank headline
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: headline required
                    instance: /api/news-items/urn:newsml:springbok.space:20261016:3f2b9c1e
                    field: headline
                languageInvalid:
                  summary: Language is not a BCP 47 tag
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: language is not a valid language tag
                    instance: /api/news-items/urn:newsml:springbok.space:20261016:3f2b9c1e
                    field: language
                authorRequired:
                  summary: Blank or missing author
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: author required
                    instance: /api/news-items/urn:newsml:springbok.space:20261016:3f2b9c1e
                    field: author
        '404':
          description: |
            No news item was ever issued with this GUID. Nothing is stored.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: news item not found
                instance: /api/news-items/urn:newsml:springbok.space:20261016:never-issued
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    InternalServerError:
      description: |
        An unexpected server-side failure. The response is deliberately generic:
        it never carries a stack trace, SQL, or any other internal detail. The
        cause is logged on the server only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: internal server error
            instance: /api/news-items

  parameters:
    Guid:
      name: guid
      in: path
      required: true
      description: |
        The system-assigned GUID. Colons are legal in a path segment (RFC 3986)
        and need not be percent-encoded.
      schema:
        $ref: '#/components/schemas/Guid'
      example: urn:newsml:springbok.space:20261016:3f2b9c1e

  schemas:
    Guid:
      type: string
      description: '`urn:newsml:<provider>:<yyyyMMdd>:<unique-id>`, always system-assigned.'
      pattern: '^urn:newsml:[^:]+:[0-9]{8}:[^:]+$'
      example: urn:newsml:springbok.space:20261016:3f2b9c1e

    CreateNewsItemRequest:
      type: object
      description: |
        The journalist's article content. Unknown properties (including any
        attempt to set `guid` or `version`) are ignored.
      required: [headline, body, language]
      properties:
        headline:
          type: string
          description: The headline. Must contain at least one non-whitespace character.
          pattern: '\S'
          example: Floods hit Cape Town
        body:
          type: string
          description: |
            Plain-text body. Paragraphs are separated by a blank line; each becomes
            one XHTML `<p>`. Must contain at least one non-whitespace character.
          pattern: '\S'
          example: "Rain fell.\n\nRoads closed.\n\nSchools shut."
        language:
          type: string
          description: |
            A well-formed BCP 47 language tag, e.g. `en` or `zu-ZA`; used as `xml:lang`.
            Free text such as `english` is rejected.
          pattern: '^[A-Za-z]{2,3}(-[A-Za-z]{4})?(-([A-Za-z]{2}|[0-9]{3}))?(-([A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*$'
          example: en

    CreateNewsItemResponse:
      type: object
      required: [guid, version]
      properties:
        guid:
          $ref: '#/components/schemas/Guid'
        version:
          type: integer
          format: int32
          minimum: 1
          description: Item version. Always 1 for a newly created item.
          example: 1

    UpdateNewsItemRequest:
      type: object
      description: |
        The complete new content of the news item, the name of its author, and the
        version the editor edited. Unknown properties are ignored.
      required: [headline, body, language, author, version]
      properties:
        headline:
          type: string
          description: The headline. Must contain at least one non-whitespace character.
          pattern: '\S'
          example: Floods hit Cape Town, two dead
        body:
          type: string
          description: |
            Plain-text body. Paragraphs are separated by a blank line; each becomes
            one XHTML `<p>`. Must contain at least one non-whitespace character.
          pattern: '\S'
          example: "Rain fell.\n\nRoads closed.\n\nSchools shut."
        language:
          type: string
          description: |
            A well-formed BCP 47 language tag, e.g. `en` or `zu-ZA`; used as `xml:lang`.
            Free text such as `english` is rejected.
          pattern: '^[A-Za-z]{2,3}(-[A-Za-z]{4})?(-([A-Za-z]{2}|[0-9]{3}))?(-([A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*$'
          example: en
        author:
          type: string
          description: The author's name. Must contain at least one non-whitespace character.
          pattern: '\S'
          example: Thandi Nkosi
        version:
          type: integer
          format: int32
          minimum: 1
          description: The version the editor edited.
          example: 1

    UpdateNewsItemResponse:
      type: object
      required: [guid, version]
      properties:
        guid:
          $ref: '#/components/schemas/Guid'
        version:
          type: integer
          format: int32
          minimum: 2
          description: The version created by this update.
          example: 2

    Problem:
      type: object
      description: RFC 9457 problem details, as produced by Spring's `ProblemDetail`.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: headline required
        instance:
          type: string
          format: uri-reference
          example: /api/news-items

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            field:
              type: string
              description: |
                The request field that broke a business rule.
              enum: [headline, body, language, author]
              example: headline
