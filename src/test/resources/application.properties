# Tests run against PostgreSQL 18 (the production database, see compose.yaml) in a Docker container
# that Testcontainers starts from this jdbc:tc: URL. Docker must be running.
# Each test JVM shares one container: @DataJpaTest rolls back every test, and acceptance tests
# create their own news items, so no test depends on another test's rows.
# Loaded alongside src/main/resources/application.yaml, adding only the test datasource.
spring.datasource.url=jdbc:tc:postgresql:18:///newsml_db
spring.datasource.username=test
spring.datasource.password=test
