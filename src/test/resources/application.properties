# Tests run against in-memory H2 in PostgreSQL compatibility mode (see CLAUDE.md).
# Each Spring test context gets its own database (random name), so tests never share rows.
# Loaded alongside src/main/resources/application.yaml, adding only the test datasource.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
