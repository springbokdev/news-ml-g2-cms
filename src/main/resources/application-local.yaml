# Local development without PostgreSQL: in-memory H2 in PostgreSQL compatibility mode.
# Data is lost when the app stops. Run with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:mem:newsml;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  # Browse the database at http://localhost:8080/h2-console (JDBC URL as above, user sa, no password).
  h2:
    console:
      enabled: true
