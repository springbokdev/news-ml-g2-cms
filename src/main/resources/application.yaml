spring:
  application:
    name: news-ml-g2-cms
  # Persistence is PostgreSQL. Defaults target the local development database;
  # override via environment variables.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/newsml_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    # Flyway owns the schema; Hibernate only checks the mappings against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

newsml:
  # The NewsML-G2 provider; one per deployment. Override via NEWSML_PROVIDER.
  provider: ${NEWSML_PROVIDER:springbok.space}
